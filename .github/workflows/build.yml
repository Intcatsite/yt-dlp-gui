name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check main process / preload / renderer / scripts
        run: |
          node --check main.js
          node --check preload.js
          node --check src/renderer.js
          node --check scripts/fetch-ytdlp.js
          node --check scripts/gen-icon.js

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Fetch bundled yt-dlp.exe
        run: node scripts/fetch-ytdlp.js win
      - name: Build Windows installer + portable exe
        run: npx electron-builder --win --publish never
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-gui-windows
          path: |
            dist/*.exe
            dist/latest*.yml
          if-no-files-found: error
